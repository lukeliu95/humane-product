<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交通費精算</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #fff; color: #222; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  .primary { display: inline-block; padding: 8px 16px; border-radius: 6px; color: #fff; background: #1f1f1f; text-decoration: none; font-size: 14px; }
  .todo { margin: 0 24px 16px; padding: 12px 16px; background: #f6f6f6; border-radius: 8px; }
  .todo button { background: transparent; border: 0; color: #b4232a; padding: 0; font-size: 14px; }
  .filters { display: flex; gap: 12px; align-items: end; padding: 0 24px 12px; }
  .more { background: transparent; border: 0; color: #444; text-decoration: underline; font-size: 14px; }
  table { border-collapse: collapse; margin: 0 24px; width: calc(100% - 48px); }
  td, th { padding: 8px; text-align: left; border-bottom: 1px solid #f0f0f0; }
</style>
</head>
<body>
<!-- 評価用の良い例。表示データは架空 -->
<header>
  <h1>交通費精算</h1>
  <a class="primary" href="#new">申請を作成</a>
</header>
<section class="todo">
  <h2>今月まだ提出していない申請：3件</h2>
  <button type="button">まとめて提出する</button>
</section>
<div class="filters">
  <label>検索 <input type="search" placeholder="申請者・行き先"></label>
  <label>月 <select><option>2026年10月</option></select></label>
  <label>状態 <select><option>未提出</option><option>提出済み</option></select></label>
  <button class="more" type="button">条件を追加</button>
</div>
<table>
  <tr><th>申請者</th><th>日付</th><th>区間</th><th>金額（税込）</th><th>状態</th></tr>
  <tr><td>長谷川 智也</td><td>10/01（木）</td><td>渋谷 → 品川</td><td>¥1,240</td><td>未提出</td></tr>
  <tr><td>佐々木 美帆</td><td>10/02（金）</td><td>大宮 → 東京（往復）</td><td>¥1,320</td><td>提出済み</td></tr>
  <tr><td>大河内 慎之介</td><td>10/05（月）</td><td>横浜 → 新宿</td><td>未入力</td><td>未提出</td></tr>
</table>
</body>
</html>
