<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商品マスタの取り込み</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 720px; padding: 24px; background: #fff; color: #222; }
  ol { padding-left: 20px; color: #555; }
  table { border-collapse: collapse; margin: 12px 0; }
  td, th { padding: 6px 10px; text-align: left; border-bottom: 1px solid #eee; }
  .cost { font-size: 14px; }
  .error { color: #b00020; }
  .primary { padding: 8px 16px; border-radius: 6px; border: 0; color: #fff; background: #1f1f1f; }
</style>
</head>
<body>
<!-- 評価用の良い例。内容は架空 -->
<h1>商品マスタの取り込み</h1>
<ol><li>ファイルを選ぶ</li><li>列を確かめる</li><li>取り込む</li></ol>
<label>ファイル（Excel・CSV） <input type="file" accept=".csv,.xlsx"></label>
<table>
  <tr><th>ファイルの列</th><th>取り込み先</th></tr>
  <tr><td>品番</td><td>品番</td></tr>
  <tr><td>品名</td><td>品名</td></tr>
  <tr><td>単価(税抜)</td><td>単価（税抜）</td></tr>
</table>
<p class="cost">この取り込みで約120ポイント使います（残り4,880ポイント）。</p>
<div class="error" role="alert">3行目：単価が空欄です。ほかの118行は取り込み済みです。<a href="#row-3">3行目を直す</a></div>
<button class="primary" type="button">取り込む</button>
</body>
</html>
